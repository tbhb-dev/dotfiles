[global]
exclude = ["home", ".git", ".vale", "tmp"]
disable = ["MD013"]

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD025]
front_matter_title = ""

[MD048]
style = "backtick"

# GitHub pastes the template into the pull request body, which starts with
# the comment telling the author how to fill it, not a heading.
[per-file-ignores]
".github/PULL_REQUEST_TEMPLATE.md" = ["MD041"]
